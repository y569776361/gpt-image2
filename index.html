<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 安全文生图客户端 - 增强自检版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm border-b border-slate-200 py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                <span>🎨</span> GPT-Image2 文生图安全客户端
            </h1>
            <span class="text-xs bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full font-medium">全域容错排错模式已开启</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto my-8 px-4 w-full grid grid-cols-1 md:grid-cols-12 gap-8 flex-grow">
        
        <section class="md:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-5">
            <h2 class="text-lg font-semibold text-slate-700 border-b pb-2">配置与控制</h2>
            
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200/60 flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">网关 HTTP 触发器基地址</label>
                    <input id="gatewayUrl" type="text" value="https://fastapi-ea-yvanulknmx.cn-hangzhou.fcapp.run" class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">合法内置 Token 令牌</label>
                    <input id="gatewayToken" type="password" value="GFCAD_Secure_2026" class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">提示词 (Prompt)</label>
                    <textarea id="prompt" rows="4" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500">一只赛博朋克风格的柴犬，霓虹灯背景，8K 超高清</textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">分辨率尺寸</label>
                        <select id="size" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:border-indigo-500">
                            <option value="1024x1024" selected>1024 x 1024</option>
                            <option value="2048x2048">2048 x 2048</option>
                            <option value="3072x3072">3072 x 3072</option>
                        </select>
                    </div>
                    <div class="flex items-center pt-6 pl-2">
                        <input id="watermark" type="checkbox" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                        <label for="watermark" class="ml-2 text-sm font-medium text-slate-700 select-none">开启官方水印</label>
                    </div>
                </div>

                <button id="generateBtn" onclick="startGeneration()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition">
                    🚀 开始生成图片
                </button>
            </div>
        </section>

        <section class="md:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col min-h-[400px]">
            <h2 class="text-lg font-semibold text-slate-700 border-b pb-2 mb-4">生成结果看板</h2>
            
            <div class="flex-grow flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 p-4 relative overflow-hidden" id="displayContainer">
                
                <div id="statusEmpty" class="text-center flex flex-col items-center gap-2">
                    <span class="text-4xl">🖼️</span>
                    <p class="text-slate-400 text-sm">暂无任务，请在左侧配置并点击生成按钮</p>
                </div>

                <div id="statusLoading" class="hidden text-center flex flex-col items-center gap-4">
                    <div class="loading-spinner"></div>
                    <div>
                        <p class="text-indigo-600 font-medium text-sm">网关已成功向云端投递任务...</p>
                        <p id="taskIdDisplay" class="text-xs text-slate-400 mt-1 font-mono"></p>
                        <p id="timerDisplay" class="text-xs text-amber-600 mt-2 font-medium bg-amber-50 px-2 py-0.5 rounded border border-amber-200 inline-block">已耗时: 0s</p>
                    </div>
                </div>

                <div id="statusSuccess" class="hidden w-full h-full flex flex-col items-center justify-between gap-4">
                    <div class="w-full max-h-[450px] overflow-hidden rounded-lg shadow-inner bg-black flex items-center justify-center">
                        <img id="resultImage" src="" alt="AI Result" class="max-w-full max-h-[450px] object-contain opacity-0 transition-opacity duration-500">
                    </div>
                    <div class="w-full bg-slate-100 p-3 rounded-lg text-xs font-mono text-slate-600 space-y-1">
                        <p class="truncate"><strong class="text-slate-700">安全重写直链:</strong> <a id="metaUrl" href="#" target="_blank" class="text-indigo-600 hover:underline"></a></p>
                        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-200 mt-1 text-slate-500">
                            <p><strong>实际扣费:</strong> <span id="metaAmount"></span></p>
                            <p><strong>最终尺寸:</strong> <span id="metaSize"></span></p>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        let pollingTimer = null;
        let elapsedSeconds = 0;
        let elapsedTimer = null;

        function switchView(viewName) {
            document.getElementById('statusEmpty').classList.add('hidden');
            document.getElementById('statusLoading').classList.add('hidden');
            document.getElementById('statusSuccess').classList.add('hidden');
            if(viewName === 'empty') document.getElementById('statusEmpty').classList.remove('hidden');
            if(viewName === 'loading') document.getElementById('statusLoading').classList.remove('hidden');
            if(viewName === 'success') document.getElementById('statusSuccess').classList.remove('hidden');
        }

        async function startGeneration() {
            const baseUrl = document.getElementById('gatewayUrl').value.trim().replace(/\/$/, "");
            const token = document.getElementById('gatewayToken').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const size = document.getElementById('size').value;
            const watermark = document.getElementById('watermark').checked;

            if(!baseUrl || !token || !prompt) {
                alert('⚠️ 错误：请完整填写网关基地址、Token 以及生成提示词！');
                return;
            }

            clearInterval(elapsedTimer);
            elapsedSeconds = 0;
            elapsedTimer = setInterval(() => {
                elapsedSeconds++;
                document.getElementById('timerDisplay').innerText = `已耗时: ${elapsedSeconds}s (安全转存同步中)`;
            }, 1000);

            switchView('loading');
            document.getElementById('generateBtn').disabled = true;

            try {
                // 采用高容错备用路由
                const response = await fetch(`${baseUrl}/image/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Gateway-Token': token
                    },
                    body: JSON.stringify({ prompt, size, watermark })
                });

                const result = await response.json();
                
                // 🌟 核心改进：全域模糊检索提取 TaskID
                let derivedTaskId = null;
                if (result) {
                    if (result.data?.taskId) derivedTaskId = result.data.taskId;
                    else if (result.taskId) derivedTaskId = result.taskId;
                    else if (result.data?.id) derivedTaskId = result.data.id;
                    else if (result.id) derivedTaskId = result.id;
                }

                if (response.ok && derivedTaskId) {
                    document.getElementById('taskIdDisplay').innerText = `Task ID: ${derivedTaskId}`;
                    startPolling(baseUrl, token, derivedTaskId);
                } else {
                    // 🌟 拒绝时：强制将第三方拦截的核心报文原封不动序列化抛出
                    const errDetail = result.msg || result.message || result.error || JSON.stringify(result);
                    throw new Error(errDetail);
                }
            } catch (err) {
                alert(`💥 发起失败原因报告:\n${err.message}`);
                resetState();
            }
        }

        function startPolling(baseUrl, token, taskId) {
            pollingTimer = setInterval(async () => {
                try {
                    const response = await fetch(`${baseUrl}/image/task?taskId=${taskId}`, {
                        method: 'GET',
                        headers: { 'X-Gateway-Token': token }
                    });

                    if (!response.ok) return;

                    const result = await response.json();
                    const targetData = result.data || result;
                    const status = String(targetData.status || '').toLowerCase();

                    if (status === 'completed' || status === 'success') {
                        clearInterval(pollingTimer);
                        clearInterval(elapsedTimer);
                        
                        const images = targetData.images || [];
                        if (images.length > 0) {
                            const rewriteUrl = images[0].url || images[0];
                            const imgEl = document.getElementById('resultImage');
                            imgEl.src = rewriteUrl;
                            imgEl.onload = () => imgEl.classList.remove('opacity-0');

                            document.getElementById('metaUrl').innerText = rewriteUrl;
                            document.getElementById('metaUrl').href = rewriteUrl;
                            document.getElementById('metaAmount').innerText = `${targetData.actualAmount || 0} USD`;
                            document.getElementById('metaSize').innerText = targetData.size || '自动';
                            switchView('success');
                        } else {
                            alert('❌ 未捕获到落盘结构中的图片直链 URL');
                            resetState();
                        }
                        document.getElementById('generateBtn').disabled = false;
                    } else if (status === 'failed' || status === 'error') {
                        clearInterval(pollingTimer);
                        clearInterval(elapsedTimer);
                        alert(`❌ 上游异步生成失败: ${targetData.errorMessage || JSON.stringify(result)}`);
                        resetState();
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 3000);
        }

        function resetState() {
            clearInterval(pollingTimer);
            clearInterval(elapsedTimer);
            switchView('empty');
            document.getElementById('generateBtn').disabled = false;
        }
    </script>
</body>
</html>
